name: Build Windows trial
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source/FloatingToDo-Windows
    steps:
      - uses: actions/checkout@v4
      - name: Extract source project
        working-directory: .
        run: Expand-Archive -Path FloatingToDo-Windows-Source.zip -DestinationPath source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingToDo-Windows-x64
          path: source/FloatingToDo-Windows/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
